name: "Tự Động Cập Nhật Nguồn & Build DuyTV APK (One-Click Build)"

on:
  workflow_dispatch:
    inputs:
      config_link:
        description: 'Dán đường link file config (hoặc link nguồn mới) vào đây'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'config/**'
      - 'gradle/**'
      - 'build.gradle.kts'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: Cài đặt Node.js để cập nhật cấu hình
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tự động phân tích và cập nhật cấu hình từ đường link
        if: "${{ github.event.inputs.config_link != '' }}"
        run: |
          node -e "
            const fs = require('fs');
            const https = require('https');
            const http = require('http');

            let inputUrl = '${{ github.event.inputs.config_link }}'.trim();
            if (!inputUrl.startsWith('http://') && !inputUrl.startsWith('https://')) {
              inputUrl = 'https://' + inputUrl;
            }
            if (inputUrl.endsWith('/')) inputUrl = inputUrl.slice(0, -1);

            const configPath = 'config/sources.json';
            let cfg = JSON.parse(fs.readFileSync(configPath, 'utf8'));

            function fetchText(url) {
              return new Promise((res) => {
                const client = url.startsWith('https') ? https : http;
                client.get(url, { headers: { 'User-Agent': 'DuyTV/1.0' }, timeout: 8000 }, (r) => {
                  let d = '';
                  r.on('data', c => d += c);
                  r.on('end', () => res(d));
                }).on('error', () => res(''));
              });
            }

            async function run() {
              let updated = false;
              if (inputUrl.includes('.json') || inputUrl.includes('raw') || inputUrl.includes('pastebin')) {
                const text = await fetchText(inputUrl);
                try {
                  const parsed = JSON.parse(text);
                  if (parsed.sources || parsed.primary_domain) {
                    fs.writeFileSync(configPath, JSON.stringify(parsed, null, 2), 'utf8');
                    console.log('✅ Đã cập nhật file config từ đường link thành công!');
                    updated = true;
                  }
                } catch {}
              }

              if (!updated) {
                const lower = inputUrl.toLowerCase();
                let targetKey = 'kkphim';
                if (lower.includes('ophim')) targetKey = 'ophim';
                else if (lower.includes('nguon') || lower.includes('phimapi')) targetKey = lower.includes('nguon') ? 'nguonc' : 'kkphim';
                else if (lower.includes('cobe')) targetKey = 'cobephim';

                if (cfg.sources[targetKey]) {
                  cfg.sources[targetKey].api_base = inputUrl;
                  cfg.last_updated = new Date().toISOString().split('T')[0];
                  fs.writeFileSync(configPath, JSON.stringify(cfg, null, 2), 'utf8');
                  console.log('✅ Đã tự cập nhật nguồn ' + targetKey + ' sang: ' + inputUrl);
                }
              }
            }

            run();
          "

      - name: Tự động commit cấu hình mới lên GitHub
        if: "${{ github.event.inputs.config_link != '' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/sources.json
          git commit -m "chore(config): tự động cập nhật cấu hình từ link dán [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Biên dịch gói APK Android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Chuẩn bị file APK hoàn thiện
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/DuyTV-Full-Latest.apk

      - name: Lưu trữ APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuyTV-Full-Latest-APK
          path: release_apk/DuyTV-Full-Latest.apk
          retention-days: 30

      - name: Tự động phát hành bản Release công khai
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.1-build-${{ github.run_number }}"
          name: "DuyTV Full Edition (Build #${{ github.run_number }})"
          body: |
            ### 🚀 Bản phát hành DuyTV Full Edition
            - **Trạng thái**: Tự động biên dịch từ link cấu hình
            - **Đường link nạp vào**: ${{ github.event.inputs.config_link || 'Mặc định từ repo' }}
            - **Thiết bị hỗ trợ**: TV Sharp Aquos, Tablet Android, Android Box, Smartphone Android.
          files: release_apk/DuyTV-Full-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
