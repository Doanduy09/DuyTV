name: "Tự Động Cập Nhật Nguồn & Build DuyTV APK (One-Click Build)"

on:
  workflow_dispatch:
    inputs:
      config_link:
        description: 'Dán đường link file config (hoặc link nguồn mới) vào đây'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'config/**'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: Cài đặt Node.js để xử lý cấu hình
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tự động phân tích nguồn từ file .config
        run: |
          node scripts/sync_from_config_file.js

      - name: Tự động commit cấu hình đồng bộ lên GitHub nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/sources.json
          git commit -m "chore: đồng bộ nguồn từ file .config [skip ci]" || echo "Không có thay đổi mới"
          git push origin main || echo "Bỏ qua push"

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Biên dịch gói APK Android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Chuẩn bị file APK hoàn thiện
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/DuyTV-Full-Latest.apk

      - name: Lưu trữ APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuyTV-Full-Latest-APK
          path: release_apk/DuyTV-Full-Latest.apk
          retention-days: 30

      - name: Tự động phát hành bản Release công khai
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.4-build-${{ github.run_number }}"
          name: "DuyTV Full Edition v1.2.4 (Build #${{ github.run_number }})"
          body: |
            ### 🚀 Bản phát hành DuyTV Full Edition v1.2.4
            - **Cơ chế**: Tự động biên dịch khi file `.config` hoặc nguồn phim thay đổi
            - **Tính năng mới**: Tải phim song song siêu tốc (<1s), cơ chế tự phục hồi đa tầng (tự động chuyển API chuẩn nếu link web nhập vào không trả JSON), Remote Fast Seek 3s/15s cho TV Sharp Aquos & Tablet
            - **Thiết bị hỗ trợ**: TV Sharp Aquos, Tablet Android, Android Box, Smartphone Android.
          files: release_apk/DuyTV-Full-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
