name: "Tự Động Build DuyTV APK (One-Click Build)"

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Ghi chú phiên bản cập nhật nguồn mới'
        required: false
        default: 'Cập nhật danh sách nguồn phim mới và tối ưu hệ thống'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'config/**'
      - 'gradle/**'
      - 'build.gradle.kts'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Biên dịch gói APK Android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Chuẩn bị file APK hoàn thiện
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/DuyTV-Full-Latest.apk

      - name: Lưu trữ APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuyTV-Full-Latest-APK
          path: release_apk/DuyTV-Full-Latest.apk
          retention-days: 30

      - name: Tự động phát hành bản Release công khai (Nếu có tag hoặc chạy thủ công)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.1-${{ github.run_number }}"
          name: "DuyTV Full Edition v1.2.1 (Build #${{ github.run_number }})"
          body: |
            ### 🚀 Bản phát hành DuyTV Full Edition
            - **Ghi chú**: ${{ github.event.inputs.release_note || 'Tự động cập nhật nguồn và tối ưu hiệu năng' }}
            - **Hỗ trợ thiết bị**: TV Sharp Aquos, Android TV Box, Tablet Android, Điện thoại Android.
            - **Tính năng nổi bật**: Bắt phím remote phần cứng, tua nhanh tăng tốc, nguồn phim đa dạng (KKPhim, OPhim, NguonC, CoBePhim, Torrent 4K).
          files: release_apk/DuyTV-Full-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
