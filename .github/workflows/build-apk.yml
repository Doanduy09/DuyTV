name: "Tự Động Cập Nhật Nguồn & Build DuyTV APK (One-Click Build)"

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Chọn nguồn cần đổi (Bỏ qua nếu chỉ muốn build lại)'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'ophim'
          - 'kkphim'
          - 'nguonc'
          - 'cobephim'
      new_url:
        description: 'Dán domain/link API mới vào đây (ví dụ: https://ophim.cc)'
        required: false
        default: ''
      release_note:
        description: 'Ghi chú cập nhật'
        required: false
        default: 'Tự động cập nhật nguồn phim và biên dịch APK mới'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'config/**'
      - 'gradle/**'
      - 'build.gradle.kts'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: Cài đặt Node.js để cập nhật cấu hình
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tự động cập nhật nguồn mới vào config nếu có nhập link
        if: "${{ github.event.inputs.new_url != '' && github.event.inputs.source_type != 'none' }}"
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('config/sources.json', 'utf8'));
            const type = '${{ github.event.inputs.source_type }}';
            let newUrl = '${{ github.event.inputs.new_url }}'.trim();
            if (!newUrl.startsWith('http://') && !newUrl.startsWith('https://')) {
              newUrl = 'https://' + newUrl;
            }
            if (newUrl.endsWith('/')) newUrl = newUrl.slice(0, -1);
            if (cfg.sources[type]) {
              cfg.sources[type].api_base = newUrl;
              console.log('✅ Đã cập nhật nguồn ' + type + ' sang domain: ' + newUrl);
            }
            cfg.last_updated = new Date().toISOString().split('T')[0];
            fs.writeFileSync('config/sources.json', JSON.stringify(cfg, null, 2), 'utf8');
          "

      - name: Tự động commit cấu hình nguồn mới lên GitHub
        if: "${{ github.event.inputs.new_url != '' && github.event.inputs.source_type != 'none' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/sources.json
          git commit -m "chore(sources): cập nhật domain ${{ github.event.inputs.source_type }} sang ${{ github.event.inputs.new_url }} [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Biên dịch gói APK Android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Chuẩn bị file APK hoàn thiện
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/DuyTV-Full-Latest.apk

      - name: Lưu trữ APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuyTV-Full-Latest-APK
          path: release_apk/DuyTV-Full-Latest.apk
          retention-days: 30

      - name: Tự động phát hành bản Release công khai
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.2.1-build-${{ github.run_number }}"
          name: "DuyTV Full Edition (Build #${{ github.run_number }})"
          body: |
            ### 🚀 Bản phát hành DuyTV Full Edition
            - **Ghi chú**: ${{ github.event.inputs.release_note || 'Tự động cập nhật nguồn và tối ưu hiệu năng' }}
            - **Nguồn cập nhật**: ${{ github.event.inputs.source_type != 'none' && format('{0} -> {1}', github.event.inputs.source_type, github.event.inputs.new_url) || 'Không thay đổi nguồn' }}
            - **Thiết bị hỗ trợ**: TV Sharp Aquos, Tablet Android, Android Box, Smartphone Android.
          files: release_apk/DuyTV-Full-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
