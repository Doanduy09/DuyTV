name: "Tự Động Cập Nhật Nguồn & Build DuyTV APK (One-Click Build)"

on:
  workflow_dispatch:
    inputs:
      config_link:
        description: 'Dán đường link file config (hoặc link nguồn mới) vào đây'
        required: false
        default: ''
      keep_releases:
        description: 'Số lượng bản Release mới nhất giữ lại trên GitHub (mặc định 1)'
        required: false
        default: '1'
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'config/**'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Tải mã nguồn repository
        uses: actions/checkout@v4

      - name: Dọn sạch các bản Build (Workflow Runs) & Release cũ trước khi Build
        run: node scripts/clean_old_releases.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_RELEASES: ${{ github.event.inputs.keep_releases || '1' }}

      - name: Đọc thông tin phiên bản từ config/version.json
        id: version_info
        run: |
          node -e "
            const v = require('./config/version.json');
            const fs = require('fs');
            const envFile = process.env.GITHUB_ENV;
            fs.appendFileSync(envFile, 'APP_VERSION=' + v.versionName + '\n');
            fs.appendFileSync(envFile, 'APP_BUILD=' + v.versionCode + '\n');
            fs.appendFileSync(envFile, 'APP_NOTES<<EOF\n' + (v.releaseNotes || 'Bản cập nhật mới nhất') + '\nEOF\n');
          "

      - name: Cài đặt Node.js để xử lý cấu hình
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tự động phân tích nguồn từ file .config
        run: |
          node scripts/sync_from_config_file.js

      - name: Tự động commit cấu hình đồng bộ lên GitHub nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/sources.json
          git commit -m "chore: đồng bộ nguồn từ file .config [skip ci]" || echo "Không có thay đổi mới"
          git push origin main || echo "Bỏ qua push"

      - name: Thiết lập môi trường Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Khôi phục Release Keystore từ GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/duytv-release.jks
            echo "DUYTV_STORE_FILE=keystore/duytv-release.jks" >> "$GITHUB_ENV"
            echo "DUYTV_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DUYTV_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DUYTV_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Biên dịch gói APK Android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Chuẩn bị file APK hoàn thiện
        run: |
          mkdir -p release_apk
          if [ -f release/DuyTV-latest.apk ]; then
            cp release/DuyTV-latest.apk release_apk/DuyTV-Full-Latest.apk
          else
            cp app/build/outputs/apk/release/app-release.apk release_apk/DuyTV-Full-Latest.apk
          fi

      - name: Lưu trữ APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuyTV-Full-Latest-APK
          path: release_apk/DuyTV-Full-Latest.apk
          retention-days: 30

      - name: Tự động phát hành bản Release công khai
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ env.APP_BUILD }}"
          name: "DuyTV Full Edition v${{ env.APP_VERSION }} (Build #${{ env.APP_BUILD }})"
          body: |
            ### 🚀 Bản phát hành DuyTV Full Edition v${{ env.APP_VERSION }} (Build #${{ env.APP_BUILD }})
            ${{ env.APP_NOTES }}

            ---
            - **Cơ chế**: Tự động cập nhật 1 chạm (In-App OTA), Tự động đồng bộ nguồn phim & kênh TV
            - **Thiết bị hỗ trợ**: Tivi Sharp Aquos, Sony, Xiaomi, TCL, Samsung Galaxy Z Fold, Máy tính bảng Android, TV Box.
          files: release_apk/DuyTV-Full-Latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tự động dọn dẹp các bản Release, Tag & APK cũ trên GitHub
        if: always()
        run: node scripts/clean_old_releases.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_RELEASES: ${{ github.event.inputs.keep_releases || '1' }}
